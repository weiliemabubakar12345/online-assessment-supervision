<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 400px; margin: 0; font-family: system-ui, Segoe UI, Arial, sans-serif;
         background: #0f1115; color: #d6deeb; }
  #head { display: flex; justify-content: space-between; align-items: center;
          padding: 10px 12px; border-bottom: 1px solid #1e2430; }
  #head strong { font-size: 14px; }
  #count { font-size: 11px; color: #8895a7; }
  #controls { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid #1e2430; }
  button { font: inherit; font-size: 12px; padding: 5px 10px; border: 1px solid #37414f;
           background: #1a1f27; color: #d6deeb; border-radius: 5px; cursor: pointer; }
  button:hover { background: #232a34; }
  #log { max-height: 460px; overflow-y: auto; padding: 6px 12px 12px;
         font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .entry { padding: 4px 0; border-bottom: 1px solid #1a2029; word-break: break-word; }
  .entry .ts { color: #7f9cf5; }
  .entry .type { font-weight: 700; }
  .t-visibility .type, .t-blur .type, .t-focus .type { color: #f6ad55; }
  .t-tab-switch .type, .t-navigation .type { color: #63b3ed; }
  .t-copy .type, .t-paste .type { color: #68d391; }
  .t-contextmenu .type { color: #fc8181; }
  .t-keyboard .type { color: #b794f4; }
  .t-mouseleave .type { color: #f6e05e; }
  .t-mutation .type { color: #4fd1c5; }
  .t-screenshot .type { color: #f687b3; }
  .t-idle .type { color: #ed8936; }
  .t-system .type { color: #8895a7; }
  .thumb { display: block; margin-top: 4px; max-width: 100%; border: 1px solid #37414f;
           border-radius: 4px; }
  .empty { color: #8895a7; padding: 16px 0; text-align: center; }
</style>
</head>
<body>
  <div id="head">
    <strong>Detection Log</strong>
    <span id="count">0 events</span>
  </div>
  <div id="controls">
    <button id="export">Export JSON</button>
    <button id="clear">Clear</button>
  </div>
  <div id="log"></div>
  <script src="popup.js"></script>
</body>
</html>
